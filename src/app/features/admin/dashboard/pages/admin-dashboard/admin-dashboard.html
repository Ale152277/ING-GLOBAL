<section class="container-fluid px-0">
  <div class="mb-4">
    <h1 class="h2 fw-bold mb-1">Dashboard</h1>

    <p class="text-muted mb-0">Resumen general del sistema</p>
  </div>

  <app-dashboard-resumen
    [pedidosTotales]="pedidosTotales"
    [pedidosPendientes]="pedidosPendientes"
    [pedidosCompletados]="pedidosCompletados"
    [productosActivos]="productosActivos"
    [productosStockBajo]="productosStockBajo"
  >
  </app-dashboard-resumen>

  <div class="row g-4 mt-1">
    <div class="col-12 col-xl-7">
      <app-pedidos-por-mes [datos]="pedidosPorMes" />
    </div>

    <div class="col-12 col-xl-5">
      <app-pedidos-recientes [pedidos]="pedidosRecientes" />
    </div>
  </div>
  <div class="row g-4 mt-1">

  <div class="col-12 col-xl-7">

    <app-productos-stock-bajo
      [productos]="productosConStockBajo"
    />

  </div>


  <div class="col-12 col-xl-5">

    <app-consultas-recientes
      [consultas]="consultasRecientes"
    />

  </div>

</div>
</section>
