<div class="card border-0 shadow-sm dashboard-card">
  <div class="card-body p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h5 class="fw-bold mb-1">
          Pedidos por mes
        </h5>

        <small class="text-muted">
          Evolución de pedidos registrados
        </small>
      </div>

      <span class="badge admin-filter-badge border fw-normal">
        Últimos 6 meses
      </span>
    </div>

    <div class="chart-container d-flex align-items-end gap-3">

      @for (dato of datos; track dato.mes) {
        <div class="chart-column d-flex flex-column text-center flex-grow-1">

          <strong class="small mb-2">
            {{ dato.total }}
          </strong>

          <div class="chart-track d-flex align-items-end">
            <div
              class="chart-bar w-100"
              [style.height.%]="obtenerAltura(dato.total)"
            ></div>
          </div>

          <small class="text-muted mt-2">
            {{ dato.mes }}
          </small>

        </div>
      }

    </div>

  </div>
</div>
