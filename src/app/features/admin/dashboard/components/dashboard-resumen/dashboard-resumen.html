<div class="row g-3">

  <div class="col-sm-6 col-xl">
    <div class="card border-0 shadow-sm h-100 summary-card">
      <div class="card-body d-flex align-items-center gap-3 p-3 p-lg-4">

        <div class="summary-icon text-danger bg-danger-subtle">
          <i class="fas fa-cart-shopping"></i>
        </div>

        <div>
          <span class="text-muted small d-block">
            Pedidos totales
          </span>

          <strong class="summary-value">
            {{ pedidosTotales }}
          </strong>
        </div>

      </div>
    </div>
  </div>

  <div class="col-sm-6 col-xl">
    <div class="card border-0 shadow-sm h-100 summary-card">
      <div class="card-body d-flex align-items-center gap-3 p-3 p-lg-4">

        <div class="summary-icon text-warning bg-warning-subtle">
          <i class="fas fa-clock"></i>
        </div>

        <div>
          <span class="text-muted small d-block">
            Pendientes
          </span>

          <strong class="summary-value">
            {{ pedidosPendientes }}
          </strong>
        </div>

      </div>
    </div>
  </div>
  <div class="col-sm-6 col-xl">
    <div class="card border-0 shadow-sm h-100 summary-card">
      <div class="card-body d-flex align-items-center gap-3 p-3 p-lg-4">

        <div class="summary-icon text-success bg-success-subtle">
          <i class="fas fa-circle-check"></i>
        </div>

        <div>
          <span class="text-muted small d-block">
            Completados
          </span>

          <strong class="summary-value">
            {{ pedidosCompletados }}
          </strong>
        </div>

      </div>
    </div>
  </div>

  <div class="col-sm-6 col-xl">
    <div class="card border-0 shadow-sm h-100 summary-card">
      <div class="card-body d-flex align-items-center gap-3 p-3 p-lg-4">

        <div class="summary-icon text-primary bg-primary-subtle">
          <i class="fas fa-box"></i>
        </div>

        <div>
          <span class="text-muted small d-block">
            Productos activos
          </span>

          <strong class="summary-value">
            {{ productosActivos }}
          </strong>
        </div>

      </div>
    </div>
  </div>

  <div class="col-sm-6 col-xl">
    <div class="card border-0 shadow-sm h-100 summary-card">
      <div class="card-body d-flex align-items-center gap-3 p-3 p-lg-4">

        <div class="summary-icon text-danger bg-danger-subtle">
          <i class="fas fa-triangle-exclamation"></i>
        </div>

        <div>
          <span class="text-muted small d-block">
            Stock bajo
          </span>

          <strong class="summary-value">
            {{ productosStockBajo }}
          </strong>
        </div>

      </div>
    </div>
  </div>

</div>
