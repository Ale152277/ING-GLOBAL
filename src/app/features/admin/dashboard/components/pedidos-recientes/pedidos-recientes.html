<div class="card border-1 shadow-sm h-100 dashboard-card">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">Pedidos recientes</h5>

      <button type="button" class="btn btn-link btn-sm text-decoration-none" disabled>
        Ver todos
        <i class="fas fa-arrow-right ms-1"></i>
      </button>
    </div>

    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Pedido</th>
            <th>Cliente</th>
            <th>Fecha</th>
            <th>Total</th>
            <th>Estado</th>
          </tr>
        </thead>

        <tbody>
          @for (pedido of pedidos; track pedido.id) {
            <tr>
              <td class="fw-semibold">#{{ pedido.id }}</td>

              <td>
                {{ pedido.cliente }}
              </td>

              <td>
                {{ formatearFecha(pedido.fecha) }}
              </td>

              <td class="fw-semibold">
                {{ formatearPrecio(pedido.total) }}
              </td>

              <td>
                <span
                  class="estado-badge"
                  [class]="'estado-badge ' + obtenerClaseEstado(pedido.estado)"
                >
                  {{ pedido.estado }}
                </span>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="text-center text-muted py-4">No existen pedidos recientes.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
