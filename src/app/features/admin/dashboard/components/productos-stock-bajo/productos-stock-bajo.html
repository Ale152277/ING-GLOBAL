<div class="card border-0 shadow-sm h-100 dashboard-card">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">Productos con stock bajo</h5>

      <a routerLink="/admin/productos" class="btn btn-link btn-sm text-decoration-none">
        Ver todos
        <i class="fas fa-arrow-right ms-1"></i>
      </a>
    </div>

    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Imagen</th>
            <th>Producto</th>
            <th>SKU</th>
            <th class="text-center">Stock</th>
          </tr>
        </thead>

        <tbody>
          @for (producto of productos; track producto.id) {
            <tr>
              <td>
                @if (producto.imagen) {
                  <img [src]="producto.imagen" [alt]="producto.nombre" class="producto-imagen" />
                } @else {
                  <div
                    class="producto-imagen-sin-imagen d-flex align-items-center justify-content-center"
                  >
                    <i class="fas fa-image text-muted"></i>
                  </div>
                }
              </td>

              <td class="fw-semibold">
                {{ producto.nombre }}
              </td>

              <td>
                <span class="sku">
                  {{ producto.sku }}
                </span>
              </td>

              <td class="text-center">
                <span
                  class="stock-badge"
                  [class]="'stock-badge ' + obtenerClaseStock(producto.stock)"
                >
                  {{ producto.stock }}
                </span>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center text-muted py-4">
                No existen productos con stock bajo.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
