<div class="login-container d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-card card shadow-lg" style="max-width: 400px; width: 100%;">
    
    <!-- Header -->
    <div class="card-header bg-primary text-white text-center py-4">
      <h3 class="mb-0">Iniciar Sesión</h3>
      <small>Ingeniera Global E-Commerce</small>
    </div>

    <!-- Body -->
    <div class="card-body p-4">
      
      <!-- Mensaje de error -->
      @if (error) {
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          <i class="fas fa-exclamation-circle"></i> {{ error }}
          <button 
            type="button" 
            class="btn-close" 
            (click)="error = ''"
          ></button>
        </div>
      }

      <!-- Formulario -->
      <form (ngSubmit)="login()" class="login-form">
        
        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input 
            type="email" 
            class="form-control form-control-lg"
            id="email"
            placeholder="tu@email.com"
            [(ngModel)]="email"
            name="email"
            required
            [disabled]="isLoading"
          >
        </div>

        <!-- Contraseña -->
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <input 
              [type]="showPassword ? 'text' : 'password'"
              class="form-control form-control-lg"
              id="password"
              placeholder="••••••••"
              [(ngModel)]="password"
              name="contraseña"
              required
              [disabled]="isLoading"
            >
            <button 
              class="btn btn-outline-secondary" 
              type="button"
              (click)="togglePasswordVisibility()"
              [disabled]="isLoading"
            >
              <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Recordarme -->
        <div class="mb-3 ">
          <div class="form-check ">
            <input 
              class="form-check-input shadow-sm rounded border " 
              type="checkbox" 
              id="remember"
              [disabled]="isLoading"
            >
            <label class="form-check-label" for="remember">
              Recuérdame
            </label>
          </div>
        </div>

        <!-- Botón de login -->
        <button 
          type="submit" 
          class="btn btn-primary btn-lg w-100 mb-3"
          [disabled]="isLoading"
        >
          @if (isLoading) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Cargando...
          } @else {
            <i class="fas fa-sign-in-alt me-2"></i>
            Iniciar Sesión
          }
        </button>

        <!-- Link a registro -->
        <div class="text-center">
          <small class="text-muted">
            ¿No tienes cuenta? 
            <a href="javascript:void(0)" (click)="irARegistro()" class="text-primary fw-bold">
              Regístrate aquí
            </a>
          </small>
        </div>

      </form>

    </div>

    <!-- Footer -->
    <div class="card-footer bg-light text-center py-3">
      <small class="text-muted">
        <i class="fas fa-lock me-1"></i>
        Acceso seguro con encriptación SSL
      </small>
    </div>

  </div>
</div>
