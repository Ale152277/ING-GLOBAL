<div class="hero-banner" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
  <!-- Slides Container -->
  <div class="slides-container">
    @for (slide of slides; let i = $index; track slide.id) {
      @if (i === currentSlide) {
        <div class="slide" [style.backgroundImage]="'url(' + slide.image + ')'">
          <img [src]="slide.image" [alt]="slide.title" class="slide-image" />
          <div class="slide-content">
            <h1 class="slide-title">{{ slide.title }}</h1>
            <p class="slide-description">{{ slide.description }}</p>
          </div>
        </div>
      }
    }
  </div>

  <!-- Botón Anterior -->
  <button class="carousel-btn carousel-btn-prev" (click)="prevSlide()" aria-label="Slide anterior">
    <i class="fas fa-chevron-left"></i>
  </button>

  <!-- Botón Siguiente -->
  <button class="carousel-btn carousel-btn-next" (click)="nextSlide()" aria-label="Siguiente slide">
    <i class="fas fa-chevron-right"></i>
  </button>

  <!-- Indicadores -->
  <div
    class="d-flex justify-content-center gap-3"
    style="position: absolute; bottom: 30px; left: 0; right: 0; z-index: 10"
  >
    @for (slide of slides; let i = $index; track slide.id) {
      <button
        class="rounded-circle border"
        [class.bg-danger]="i === currentSlide"
        [class.bg-transparent]="i !== currentSlide"
        [style.width.px]="12"
        [style.height.px]="12"
        (click)="goToSlide(i)"
        [attr.aria-label]="'Slide ' + (i + 1)"
        style="cursor: pointer; border-color: rgba(255, 255, 255, 0.5)"
      ></button>
    }
  </div>
</div>
