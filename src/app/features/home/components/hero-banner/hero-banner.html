<section>
  <div>
    <div
      class="hero-banner overflow-hidden shadow-sm position-relative"
      (mouseenter)="onMouseEnter()"
      (mouseleave)="onMouseLeave()"
    >
      <div class="slides-container">
        @for (slide of slides; let i = $index; track slide.id) {
          @if (i === currentSlide) {
            <div class="slide">
              <img [src]="slide.image" [alt]="slide.title" class="slide-image" />

              <div class="slide-content">
                <div class="hero-text">
                  <h1 class="fw-bold mb-2">
                    {{ slide.title }}
                  </h1>

                  @if (slide.description) {
                    <p class="mb-0">
                      {{ slide.description }}
                    </p>
                  }
                </div>
              </div>
            </div>
          }
        }
      </div>

      <!-- ANTERIOR -->
      <button
        type="button"
        class="carousel-btn carousel-btn-prev btn"
        (click)="prevSlide()"
        aria-label="Slide anterior"
      >
        <i class="fas fa-chevron-left"></i>
      </button>
      <button
        type="button"
        class="carousel-btn carousel-btn-next btn"
        (click)="nextSlide()"
        aria-label="Siguiente slide"
      >
        <i class="fas fa-chevron-right"></i>
      </button>
      <div class="carousel-indicators-custom d-flex justify-content-center gap-2">
        @for (slide of slides; let i = $index; track slide.id) {
          <button
            type="button"
            class="carousel-indicator rounded-circle border"
            [class.active]="i === currentSlide"
            (click)="goToSlide(i)"
            [attr.aria-label]="'Ir al slide ' + (i + 1)"
          ></button>
        }
      </div>
    </div>
  </div>
</section>
