<div class="toast-stack" role="status" aria-live="polite">
  @for (toast of toasts$ | async; track toast.id) {
    <div class="toast-slot" [class.saliendo]="toast.saliendo">
      <div class="toast-slot-inner">
        <div
          class="toast-item"
          [class.toast-success]="toast.tipo === 'success'"
          [class.toast-error]="toast.tipo === 'error'"
        >
          <i class="fas toast-icono" [ngClass]="toast.icono || iconos[toast.tipo]" aria-hidden="true"></i>

          <span class="toast-mensaje">{{ toast.mensaje }}</span>

          @if (toast.accion; as accion) {
            @if (accion.enlace) {
              <a class="toast-accion" [routerLink]="accion.enlace" (click)="cerrar(toast)">{{ accion.etiqueta }}</a>
            } @else {
              <button type="button" class="toast-accion" (click)="ejecutarAccion(toast)">
                {{ accion.etiqueta }}
              </button>
            }
          }

          <button type="button" class="toast-cerrar" aria-label="Cerrar notificación" (click)="cerrar(toast)">
            <i class="fas fa-xmark"></i>
          </button>
        </div>
      </div>
    </div>
  }
</div>
